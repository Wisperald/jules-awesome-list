<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ислам — большая хронология 570–2026</title>
<link rel="stylesheet" href="../src/fonts.css">
<style>
  html,body{margin:0;background:#FBF9F4}
  svg text{font-family:'Inter',sans-serif}
</style>
<script src="data.js"></script>
</head>
<body>
<svg id="poster" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
(async () => {
await Promise.all(["500 12px Inter","600 12px Inter","700 12px Inter","800 12px Inter","italic 500 12px 'Playfair Display'","500 12px Unbounded","600 12px Unbounded","700 12px Unbounded","800 12px Unbounded","400 12px Amiri"].map(f=>document.fonts.load(f,'Аа1ب')));
await document.fonts.ready;
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('poster');
const C = { ink:'#14171B', ink2:'#3A4048', muted:'#6A7078', line:'#E6DFCF', paper:'#FBF9F4', band:'#F4EEE1',
  gold:'#B8892B', goldL:'#E9C877', em:'#0B4A38', emD:'#062E23',
  sun:'#0E7A5A', shi:'#3346A8', kha:'#B4531F', suf:'#0090B0', mod:'#C0395A', het:'#6F52A8', kal:'#A06A00',
  ext:'#8B1E1E', mix:'#6B7280', pol:'#C0395A' };

// ---------- шкала (неравномерная) ----------
const SEG = [[570,750,5.6],[750,1300,2.7],[1300,1800,2.05],[1800,2026,6.6]];
const LEFT = 360, X0 = LEFT + 30;
function X(y){ let x = X0; for (const [a,b,k] of SEG){ if (y<=a) break; x += (Math.min(y,b)-a)*k; } return x; }
const XEND = X(2026), W = XEND + 300;

// ---------- утилиты ----------
const cv = document.createElement('canvas').getContext('2d');
function tw(t, size=12.5, weight=500, fam='Inter'){ cv.font = `${weight} ${size}px ${fam}`; return cv.measureText(t).width; }
function el(tag, attrs={}, parent=svg){ const e=document.createElementNS(NS,tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
function txt(x,y,t,attrs={},parent=svg){ const e=el('text',{x,y,...attrs},parent); e.textContent=t; return e; }
function pack(items, gap=12){ // items: {x0,x1}; returns rows
  const rows=[]; for (const it of items){ let r=rows.findIndex(end=>end+gap<=it.x0); if (r<0){ r=rows.length; rows.push(0);} rows[r]=it.x1; it.row=r; } return rows.length; }

const defs = el('defs');
const pat = el('pattern',{id:'hatch',width:6,height:6,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},defs);
el('rect',{width:6,height:6,fill:'transparent'},pat); el('line',{x1:0,y1:0,x2:0,y2:6,stroke:'rgba(255,255,255,.45)','stroke-width':2.4},pat);
const bgPat = el('pattern',{id:'stars',width:56,height:56,patternUnits:'userSpaceOnUse'},defs);
el('rect',{x:14,y:14,width:28,height:28,fill:'none',stroke:'#E9C877','stroke-width':1},bgPat);
el('rect',{x:14,y:14,width:28,height:28,fill:'none',stroke:'#E9C877','stroke-width':1,transform:'rotate(45 28 28)'},bgPat);

// ---------- ШАПКА ----------
const HEAD = 470;
el('rect',{x:0,y:0,width:W,height:HEAD,fill:C.emD});
el('rect',{x:0,y:0,width:W,height:HEAD,fill:'url(#stars)',opacity:.13});
txt(70,92,'БОЛЬШАЯ ХРОНОЛОГИЯ · 570 — 2026',{fill:C.goldL,'font-family':'Unbounded','font-weight':600,'font-size':22,'letter-spacing':'0.3em'});
txt(62,250,'ИСЛАМ',{fill:'#fff','font-family':'Unbounded','font-weight':800,'font-size':170,'letter-spacing':'-0.02em'});
txt(72,318,'Четырнадцать веков в одной картине: эпохи, события, державы, все ветви и расколы, школы права и вероучения,',{fill:'#F1E4C2','font-family':'Playfair Display','font-style':'italic','font-weight':500,'font-size':30});
txt(72,358,'суфийские ордены, реформаторские и новые движения, личности — от откровения в пещере Хира до 2026 года',{fill:'#F1E4C2','font-family':'Playfair Display','font-style':'italic','font-weight':500,'font-size':30});
txt(W-80,250,'ٱلْإِسْلَام',{fill:C.goldL,'font-family':'Amiri','font-size':190,'text-anchor':'start',direction:'rtl'});
// статистика
const stats=[['≈2 млрд','мусульман — 25,6% человечества'],['85–90%','сунниты'],['10–13%','шииты'],['≈0,2%','ибадиты'],['57','стран в ОИС']];
let sx = 72; for (const [v,l] of stats){ txt(sx,428,v,{fill:C.goldL,'font-family':'Unbounded','font-weight':800,'font-size':34}); const w1=tw(v,34,800,'Unbounded'); txt(sx+w1+12,428,l,{fill:'#CFE3DA','font-size':17,'font-weight':500}); sx += w1+tw(l,17)+70; }
// легенда направлений
let lx = W-80; const legend=[...LANES.map(l=>[l.color,l.name.split(':')[0]]),[C.het,'Гетеродоксия / спорный статус']].reverse();
for (const [c,n] of legend){ const w=tw(n,16,500)+36; lx-=w; el('rect',{x:lx,y:408,width:20,height:20,rx:4,fill:c}); txt(lx+28,424,n,{fill:'#E6F0EB','font-size':16,'font-weight':500}); }
txt(W-80,380,'▶ течение существует сегодня   ◆ полоса со штриховкой — политический ислам   ● точка ветвления — раскол / происхождение',{fill:'#CFE3DA','font-size':16,'text-anchor':'end'});

// ---------- основная сетка ----------
let y = HEAD + 30;
const gridTop = y;
// эпохи
const ERA_H = 44;
ERAS.forEach(([a,b,n],i)=>{ const x0=X(a), x1=X(b); el('rect',{x:x0,y,width:x1-x0-2,height:ERA_H,fill:i%2?'#0E5A43':'#0B4A38'});
  const w=tw(n,15,600); const t=w<x1-x0-16?n:(tw(n.split(' · ')[0],15,600)<x1-x0-16?n.split(' · ')[0]:'');
  txt((x0+x1)/2,y+28,t,{fill:'#fff','font-size':15,'font-weight':600,'text-anchor':'middle'}); });
txt(LEFT-10,y+28,'ЭПОХИ',{fill:C.em,'font-family':'Unbounded','font-weight':700,'font-size':15,'text-anchor':'end','letter-spacing':'0.12em'});
y += ERA_H + 8;
// ось
function axis(yy, up){
  const ticks=[]; for (let t=600;t<=2000;t+= 50) ticks.push(t); [570,1750,1850,1875,1925,1950,1975,2026,1825,1900].forEach(t=>ticks.push(t));
  for (const t of [...new Set(ticks)].sort((a,b)=>a-b)){ if (t>=1800&&t<2026&&t%25) continue; const big=t%100===0;
    txt(X(t),yy,String(t),{fill:big?C.ink:C.muted,'font-family':'Unbounded','font-weight':big?700:500,'font-size':big?15:12,'text-anchor':'middle'}); }
}
axis(y+18); y += 34;
const gridStart = y;

const gridG = el('g'); const contentG = el('g');

// ---------- СОБЫТИЯ ----------
function sectionTitle(yy, h, title, ar, color, note){
  el('rect',{x:0,y:yy,width:LEFT,height:h,fill:color},contentG);
  el('rect',{x:LEFT,y:yy,width:W-LEFT,height:h,fill:color,opacity:.045},gridG);
  const lines=[]; let cur=''; for (const w of title.split(' ')){ if (tw(cur+' '+w,22,800,'Unbounded')>LEFT-50 && cur){ lines.push(cur); cur=w;} else cur=cur?cur+' '+w:w; } lines.push(cur);
  lines.forEach((l,i)=>txt(26,yy+42+i*28,l,{fill:'#fff','font-family':'Unbounded','font-weight':800,'font-size':22},contentG));
  let ny = yy+42+lines.length*28;
  if (ar){ txt(26,ny+10,ar,{fill:'rgba(255,255,255,.75)','font-family':'Amiri','font-size':26},contentG); ny+=36; }
  if (note){ let cur2='', lines2=[]; for (const w of note.split(' ')){ if (tw(cur2+' '+w,14,500)>LEFT-52 && cur2){ lines2.push(cur2); cur2=w;} else cur2=cur2?cur2+' '+w:w; } lines2.push(cur2);
    lines2.forEach((l,i)=>{ if (ny+14+i*19 < yy+h-8) txt(26,ny+14+i*19,l,{fill:'rgba(255,255,255,.88)','font-size':14,'font-weight':500},contentG); }); }
}

const evItems = EVENTS.map(([yr,t,imp])=>{ const label=`${yr} · ${t}`; const w=tw(label,imp>1?14:13,imp>1?700:500); const x0=X(yr)-4; return {yr,t,imp,label,x0,x1:x0+w+8}; });
evItems.sort((a,b)=>a.x0-b.x0); const evRows=pack(evItems,10);
const EV_ROW=24, evH = evRows*EV_ROW + 40;
sectionTitle(y, evH, 'Ключевые события', 'أحداث', C.ink2, 'Даты, изменившие ход истории уммы.');
const evBase = y + evH - 12;
el('line',{x1:X0-10,y1:evBase,x2:XEND+10,y2:evBase,stroke:C.ink2,'stroke-width':2},contentG);
const evLabG = el('g',{},contentG);
for (const e of evItems){ const ly = y + 22 + (evRows-1-e.row)*EV_ROW; const x=X(e.yr);
  el('line',{x1:x,y1:ly+4,x2:x,y2:evBase,stroke:e.imp>1?C.gold:'#C8BFA9','stroke-width':e.imp>1?1.6:1},contentG);
  el('circle',{cx:x,cy:evBase,r:e.imp>1?5.5:3.5,fill:e.imp>1?C.gold:C.ink2,stroke:C.paper,'stroke-width':2},contentG);
  el('rect',{x:e.x0,y:ly-13,width:e.x1-e.x0,height:19,fill:C.paper},evLabG);
  txt(e.x0+4,ly+1,e.label,{fill:e.imp>1?C.ink:C.ink2,'font-size':e.imp>1?14:13,'font-weight':e.imp>1?700:500},evLabG); }
contentG.appendChild(evLabG);
y += evH + 10;

// ---------- ПОЛОСЫ (общий рендер) ----------
const ROW = 25, BAR = 18;
const pos = {}; // id -> {x0,x1,y}
function barColor(base, flags){ if (flags.includes('W')) return C.ext; if (flags.includes('H')) return C.het; return base; }
function drawLane(title, ar, color, note, rawItems, opts={}){
  const items = rawItems.map(r=>{ const [id,a,b,label,parent,flags='']=r; const x0=X(a), x1=Math.max(X(b), x0+6); const w=tw(label,12.5,600);
    const inside = w+14 < x1-x0; return {id,a,b,label,parent,flags,x0,x1,w,inside, xs:x0, xe: inside? x1 + (flags.includes('L')?16:0) : x1 + (flags.includes('L')?16:4) + w + 8 }; });
  const sorted=[...items].sort((p,q)=>p.x0-q.x0||p.x1-q.x1); pack(sorted.map(it=>{ it.x0p=it.xs; return Object.assign(it,{x0:it.xs,x1r:it.x1, x1:it.xe}); }),14);
  items.forEach(it=>{ it.x1=it.x1r; });
  const rows = Math.max(...items.map(i=>i.row))+1;
  const minH = opts.minH || 0; const h = Math.max(rows*ROW + 26, minH);
  sectionTitle(y, h, title, ar, color, note);
  const top = y + 14 + (h - rows*ROW - 26)/2;
  for (const it of items){
    const by = top + it.row*ROW; const col = opts.colorOf ? opts.colorOf(it) : barColor(color, it.flags);
    pos[it.id] = {x0:it.x0,x1:it.x1,y:by+BAR/2,col};
    const r = el('rect',{x:it.x0,y:by,width:it.x1-it.x0,height:BAR,rx:4,fill:col},contentG);
    if (it.flags.includes('P')) el('rect',{x:it.x0,y:by,width:it.x1-it.x0,height:BAR,rx:4,fill:'url(#hatch)'},contentG);
    if (it.flags.includes('L')) el('path',{d:`M${it.x1+2},${by} L${it.x1+13},${by+BAR/2} L${it.x1+2},${by+BAR} Z`,fill:col},contentG);
    const lab = it.inside ? txt(it.x0+7,by+13.3,it.label,{fill:'#fff','font-size':12.5,'font-weight':600},contentG)
                          : txt(it.x1+(it.flags.includes('L')?18:6),by+13.3,it.label,{fill:C.ink,'font-size':12.5,'font-weight':600},contentG);
    it.by = by;
  }
  y += h + 10;
  return items;
}

// ---------- ДЕРЖАВЫ ----------
const stItems = STATES.map((s,i)=>['st'+i,s[0],s[1],s[2],null,(s[4]?'L':'')+'|'+s[3]]);
drawLane('Державы и династии','الدول والسلالات',C.em,'Цвет полосы — вероисповедание правящей династии: зелёный — сунниты, синий — шииты, оранжевый — ибадиты, малиновый — ваххабитское государство.',
  stItems,{minH:300,colorOf:it=>{ const k=it.flags.split('|')[1]; return {sun:C.sun,shi:C.shi,kha:C.kha,mod:C.mod,mix:C.mix,gold:C.gold}[k]; }});
// очистка флагов для стрелок у держав
// ---------- ТЕЧЕНИЯ ----------
const laneMinH = {kha:240, shi:380, sun:330, kal:280, suf:380, mod:380, ext:230};
for (const L of LANES) drawLane(L.name, L.ar, L.color, L.note, L.items, {minH:laneMinH[L.id]});

// ---------- ЛИЧНОСТИ ----------
const peopleItems = PEOPLE.map((p,i)=>['p'+i,p[0],p[1],p[2],null,(p[4]?'L':'')+'|'+p[3]]);
drawLane('Личности','أعلام',C.ink2,'Годы жизни ключевых фигур. Цвет — направление или сфера деятельности.',peopleItems,{minH:300,colorOf:it=>{ const k=it.flags.split('|')[1]; return {sun:C.sun,shi:C.shi,suf:C.suf,kal:C.kal,mod:C.mod,pol:C.mod,het:C.het,ext:C.ext,gold:C.gold}[k]; }});

// ---------- связи ветвлений ----------
const linkG = el('g'); contentG.parentNode.insertBefore(linkG, contentG);
for (const L of LANES) for (const [id,a,,,parent] of L.items){ if (!parent || !pos[parent]) continue; const c=pos[id], p=pos[parent]; const x=c.x0;
  const px=Math.min(Math.max(x,p.x0+4),p.x1-2); const py=p.y+BAR/2;
  el('path',{d:`M${px},${py} C${px},${(py+c.y)/2} ${x-16},${c.y} ${x},${c.y}`,fill:'none',stroke:c.col,'stroke-width':2,opacity:.6},linkG);
  el('circle',{cx:px,cy:py,r:3.6,fill:c.col,stroke:'#fff','stroke-width':1.2},linkG); }
// ---------- сетка ----------
const gridEnd = y;
for (let t=600;t<=2025;t+= (t>=1800?25:50)){ const big=t%100===0; el('line',{x1:X(t),y1:gridStart,x2:X(t),y2:gridEnd,stroke:big?'#D9CFB8':'#ECE5D4','stroke-width':big?1.4:1},gridG); }
el('line',{x1:X(2026),y1:gridStart,x2:X(2026),y2:gridEnd,stroke:C.gold,'stroke-width':2,'stroke-dasharray':'6 5'},gridG);
// отметки смены масштаба
for (const b of [750,1300,1800]){ el('line',{x1:X(b),y1:gridTop-8,x2:X(b),y2:gridEnd,stroke:C.gold,'stroke-width':1,'stroke-dasharray':'2 6',opacity:.8},gridG); }
axis(y+18); y += 40;

// ---------- ПОДВАЛ ----------
const FOOT = 150;
el('rect',{x:0,y,width:W,height:FOOT,fill:C.emD});
txt(70,y+52,'Шкала неравномерная: VII–VIII и XIX–XXI вв. растянуты (пунктир — смена масштаба: 750, 1300, 1800). Даты ранних событий приблизительны. Численность — оценки Pew Research Center (2025) и национальных данных.',{fill:'#D9E8E1','font-size':17,'font-weight':500});
txt(70,y+84,'Отмеченные тёмно-красным организации признаны террористическими в Казахстане, России и/или ООН; сведения носят справочный характер. Данные о 2025–2026 гг. — по состоянию на осень 2026 г.',{fill:'#D9E8E1','font-size':17,'font-weight':500});
txt(70,y+118,'Приложение к энциклопедии «Ислам: история веры, личности, течения» · Издание 2026',{fill:C.goldL,'font-family':'Unbounded','font-weight':600,'font-size':15,'letter-spacing':'0.08em'});
txt(W-80,y+100,'وَجَعَلْنَاكُمْ شُعُوبًا وَقَبَائِلَ لِتَعَارَفُوا',{fill:C.goldL,'font-family':'Amiri','font-size':44,'text-anchor':'start',direction:'rtl'});
y += FOOT;

svg.setAttribute('width',W); svg.setAttribute('height',y); svg.setAttribute('viewBox',`0 0 ${W} ${y}`);
svg.insertBefore(el('rect',{x:0,y:0,width:W,height:y,fill:C.paper}), svg.firstChild.nextSibling);
window.__size = {w:Math.ceil(W), h:Math.ceil(y)}; window.__done = true;
})();
</script>
</body>
</html>
